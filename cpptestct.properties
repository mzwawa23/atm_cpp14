# === END USER LICENSE AGREEMENT ===
# Set to true to accept the Parasoft End User License Agreement (EULA).
# Please review the EULA.txt file included in the product installation directory.
parasoft.eula.accepted=true

# === USAGE DATA ===
# Enables sending anonymous usage data to Parasoft.
#usage.reporting.enabled=true

# === LOCAL LICENSE ===
# Enables local license - be sure to specify password.
#cpptestct.license.use_network=false

# Specifies password for the local license. 
#cpptestct.license.local.password=<LICENSE_PASSWORD>

# === NETWORK LICENSE ===
# Enables network license - be sure to configure License Server or DTP settings below.
cpptestct.license.use_network=true

# Specifies type of the network license (edition).
# Supported editions: quality_edition, compliance_edition
cpptestct.license.network.edition=compliance_edition

# Enables specific list of license features.
#cpptestct.license.network.edition=custom_edition
#cpptestct.license.custom_edition_features=C++test,CT Core,CT Extended Coverage

# === LICENSE SERVER SETTINGS ===

# Specifies URL of a License Server in the form https://host[:port][/context-path]:
#license.network.url=<HOST>:<PORT>
#license.network.use.specified.server=true

# Enables License Server authentication
#license.network.auth.enabled=true

# Specifies user name for License Server authentication.
#license.network.user=<USER>

# Specifies password for License Server authentication.
#license.network.password=<PASSWORD>

# === DTP SERVER SETTINGS ===

# Specifies URL of a DTP server in the form https://host[:port][/context-path]
